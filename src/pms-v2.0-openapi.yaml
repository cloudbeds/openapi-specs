          type: string
          format: date
          example: '2024-01-01'
        endDate:
          type: string
          format: date
          example: '2024-01-31'
        day0:
          description: 'Sunday (day 0) -- apply exception on this day of the week.'
          type: boolean
          example: true
        day1:
          description: 'Monday (day 1) -- apply exception on this day of the week.'
          type: boolean
          example: true
        day2:
          description: 'Tuesday (day 2) -- apply exception on this day of the week.'
          type: boolean
          example: true
        day3:
          description: 'Wednesday (day 3) -- apply exception on this day of the week.'
          type: boolean
          example: true
        day4:
          description: 'Thursday (day 4) -- apply exception on this day of the week.'
          type: boolean
          example: true
        day5:
          description: 'Friday (day 5) -- apply exception on this day of the week.'
          type: boolean
          example: true
        day6:
          description: 'Saturday (day 6) -- apply exception on this day of the week.'
          type: boolean
          example: true
      type: object
    PolicyExceptionListResponseSchema:
      required:
        - total
        - limit
        - offset
        - data
      properties:
        total:
          description: 'The total number of items available.'
          type: integer
        limit:
          description: 'The limit for the number of items to return.'
          type: integer
        offset:
          description: 'The offset for the current page of results.'
          type: integer
        data:
          type: array
          items:
            $ref: '#/components/schemas/PolicyExceptionResponseSchema'
      type: object
    PolicyExceptionRateResponseSchema:
      properties:
        packageId:
          description: 'Package/rate plan ID. 0 = base rate.'
          type: string
          example: '123'
        roomTypeId:
          description: 'Room type ID.'
          type: string
          example: '456'
          nullable: true
      type: object
    PolicyExceptionResponseSchema:
      properties:
        id:
          type: string
          example: '5001'
        propertyId:
          type: string
          example: '1234'
        name:
          type: string
          example: 'Winter holiday exception'
        policyRootId:
          type: string
          example: '1001'
        enabled:
          type: boolean
          example: true
        createdBy:
          type: string
          example: '9876'
        createdAt:
          type: string
          format: date-time
          example: '2024-01-01T10:00:00+00:00'
        updatedAt:
          type: string
          format: date-time
          example: '2024-01-15T12:00:00+00:00'
        intervals:
          type: array
          items:
            $ref: '#/components/schemas/PolicyExceptionIntervalResponseSchema'
        rates:
          type: array
          items:
            $ref: '#/components/schemas/PolicyExceptionRateResponseSchema'
      type: object
    PolicySummaryRowSchema:
      required:
        - timingLabel
        - actionCopy
      properties:
        timingLabel:
          description: 'When the row applies, as display copy.'
          type: string
          example: 'Until Nov 8, 2026'
        actionCopy:
          description: 'What happens at that time, as display copy.'
          type: string
          example: 'Free cancellation'
        detail:
          description: 'Additional detail for the row; null when there is none.'
          type: string
          example: 'Full refund of the deposit.'
          nullable: true
        anchor:
          description: 'Machine-readable anchor the timing is relative to; null when not applicable.'
          type: string
          example: CHECK_IN
          nullable: true
        anchorOffsetMinutes:
          description: 'Offset from the anchor in minutes; null when not applicable.'
          type: integer
          example: -1440
          nullable: true
        dateTime:
          description: 'Resolved ISO 8601 datetime for the row; null when not resolvable.'
          type: string
          format: date-time
          example: '2026-11-08T00:00:00+00:00'
          nullable: true
      type: object
    PolicyTextSchema:
      required:
        - id
        - name
        - rootId
        - guaranteeText
        - cancellationText
        - noShowText
        - additionalPolicyText
      properties:
        id:
          description: 'Smart policy ID; null when the text comes from the legacy policy fallback.'
          type: string
          example: '42310212898960'
          nullable: true
        name:
          description: 'Smart policy name; null when the text comes from the legacy policy fallback.'
          type: string
          example: 'Standard 3-day policy'
          nullable: true
        rootId:
          description: 'Root ID of the smart policy version chain; null when the text comes from the legacy policy fallback.'
          type: string
          example: '42310212898960'
          nullable: true
        guaranteeText:
          description: 'Human-readable guarantee / payment policy text; empty when the text comes from the legacy policy fallback (which only provides cancellation text).'
          type: string
          example: 'A deposit of 20% is collected at the time of booking.'
        cancellationText:
          description: 'Human-readable cancellation policy text.'
          type: string
          example: 'Free cancellation until 3 days before check-in; the deposit is forfeited afterwards.'
        noShowText:
          description: 'Human-readable no-show policy text; empty when the policy has none.'
          type: string
          example: 'No-shows are charged the full reservation amount.'
        additionalPolicyText:
          description: 'Additional free-form policy text configured by the property; empty when none.'
          type: string
          example: ''
        cancellationType:
          oneOf:
            -
              $ref: '#/components/schemas/PolicyCancellationTypeSchema'
          nullable: true
          description: 'Cancellation refundability classification; null when not determinable.'
        paymentSummaryRows:
          description: 'Payment milestone rows for timeline display; null when not available.'
          type: array
          items:
            $ref: '#/components/schemas/PolicySummaryRowSchema'
          nullable: true
        cancellationSummaryRows:
          description: 'Cancellation milestone rows for timeline display; null when not available.'
          type: array
          items:
            $ref: '#/components/schemas/PolicySummaryRowSchema'
          nullable: true
        noShowSummaryRows:
          description: 'No-show milestone rows for timeline display; null when not available.'
          type: array
          items:
            $ref: '#/components/schemas/PolicySummaryRowSchema'
          nullable: true
      type: object
    PreviewAdjustmentResponseSchema:
      properties:
        resultType:
          description: 'The outcome of the adjustment preview.'
          type: string
          enum:
            - SCHEDULED_PAYMENT_REDUCED
            - SCHEDULED_PAYMENT_CANCELLED
            - REFUND_REQUIRED
            - NO_SCHEDULE_CHANGE
            - NO_SMART_POLICY
          example: SCHEDULED_PAYMENT_REDUCED
        newReservationTotal:
          $ref: '#/components/schemas/MoneySchema'
        alreadyPaid:
          $ref: '#/components/schemas/MoneySchema'
        refundRequired:
          $ref: '#/components/schemas/MoneySchema'
        scheduledPayments:
          type: array
          items:
            $ref: '#/components/schemas/PreviewScheduledPaymentSchema'
      type: object
    PreviewScheduledPaymentSchema:
      properties:
        id:
          type: string
          example: '1001'
        originalAmount:
          $ref: '#/components/schemas/MoneySchema'
        newAmount:
          $ref: '#/components/schemas/MoneySchema'
        status:
          description: 'Status of the scheduled payment after the adjustment.'
          type: string
          enum:
            - REDUCED
            - CANCELLED
            - UNCHANGED
          example: REDUCED
      type: object
    ScheduledPaymentDisplayItemSchema:
      required:
        - formattedDate
        - formattedAmountWithIsoCode
        - formattedAmountWithSymbol
        - type
      properties:
        formattedDate:
          description: 'Payment collection date, formatted for display in the property''s locale.'
          type: string
          example: 'Nov 10, 2026'
        formattedAmountWithIsoCode:
          description: 'Payment amount formatted with the ISO 4217 currency code.'
          type: string
          example: 'USD 100.00'
        formattedAmountWithSymbol:
          description: 'Payment amount formatted with the currency symbol.'
          type: string
          example: $100.00
        type:
          description: 'Scheduled payment type.'
          type: string
          example: deposit
      type: object
    ScheduledPaymentItemSchema:
      required:
        - actionIds
        - timestamp
        - amount
        - currency
        - orderId
        - isInitialDeposit
      properties:
        actionIds:
          description: 'Identifiers of the actions covered by this scheduled payment.'
          type: array
          items:
            type: string
          example:
            - '19'
            - '20'
        timestamp:
          description: 'When the payment is scheduled to be collected; null when not yet determined.'
          type: string
          format: date-time
          example: '2024-11-10T00:00:00.000Z'
          nullable: true
        amount:
          description: 'Payment amount in minor units.'
          type: integer
          example: 4000
        currency:
          description: 'ISO 4217 currency code.'
          type: string
          example: EUR
        orderId:
          description: 'Order identifier the payment belongs to.'
          type: string
          example: '0'
        isInitialDeposit:
          description: 'Whether this payment is the initial deposit.'
          type: boolean
          example: false
      type: object
    SmartPolicyPaymentItemSchema:
      required:
        - paymentId
        - amount
        - cardType
        - cardLast4
        - createdAt
        - scheduledFor
        - transactionType
      properties:
        paymentId:
          description: 'Payment ID.'
          type: string
          example: '542543'
        amount:
          $ref: '#/components/schemas/MoneySchema'
        cardType:
          description: 'Card brand when the payment is card-backed.'
          type: string
          example: master
          nullable: true
        cardLast4:
          description: 'Last 4 digits of the card when the payment is card-backed.'
          type: string
          example: '4675'
          nullable: true
        createdAt:
          description: 'Payment creation datetime in the property''s local time (Y-m-d H:i:s).'
          type: string
          pattern: '^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$'
          example: '2026-06-07 10:09:54'
          nullable: true
        scheduledFor:
          description: 'When the payment is or was scheduled to be collected, property-local (Y-m-d H:i:s).'
          type: string
          pattern: '^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$'
          example: '2026-06-12 00:00:00'
          nullable: true
        transactionType:
          description: 'Transaction type (Purchase, Authorize, or Capture).'
          type: string
          example: Purchase
      type: object
    SmartPolicyPaymentsResponseSchema:
      required:
        - scheduled
        - processed
        - canceledScheduled
        - totalScheduled
        - totalProcessed
        - totalCanceledScheduled
        - smartPolicyEnabled
      properties:
        scheduled:
          description: 'Smart Policy payments still scheduled for automatic execution, including future authorization holds.'
          type: array
          items:
            $ref: '#/components/schemas/SmartPolicyPaymentItemSchema'
        processed:
          description: 'Smart Policy payments already executed: successful purchases and captures, plus active authorization holds.'
          type: array
          items:
            $ref: '#/components/schemas/SmartPolicyPaymentItemSchema'
        canceledScheduled:
          description: 'Formerly scheduled Smart Policy payments that were canceled (e.g. by turning Smart Policy off).'
          type: array
          items:
            $ref: '#/components/schemas/SmartPolicyPaymentItemSchema'
        totalScheduled:
          oneOf:
            -
              $ref: '#/components/schemas/MoneySchema'
          nullable: true
          description: 'Sum of the scheduled payments, excluding authorization holds; null when the reservation has no Smart Policy payments.'
        totalProcessed:
          oneOf:
            -
              $ref: '#/components/schemas/MoneySchema'
          nullable: true
          description: 'Sum of the processed (collected) payments, excluding authorization holds; null when the reservation has no Smart Policy payments.'
        totalCanceledScheduled:
          oneOf:
            -
              $ref: '#/components/schemas/MoneySchema'
          nullable: true
          description: 'Sum of the canceled formerly-scheduled payments, excluding authorization holds; null when the reservation has no Smart Policy payments.'
        smartPolicyEnabled:
          description: 'Whether Smart Policy automation is currently on for the reservation: true while at least one of its rooms still has the policy active, false once it was turned off (or the reservation has no policy rows).'
          type: boolean
          example: true
      type: object
    AddonSchema:
      required:
        - addonId
        - name
        - amount
        - quantity
      properties:
        addonId:
          description: 'Add-on ID'
          type: string
          example: '789'
        name:
          description: 'Add-on display name'
          type: string
          example: Parking
        amount:
          oneOf:
            -
              $ref: '#/components/schemas/MoneyInputSchema'
          nullable: true
          description: 'Add-on unit price'
        quantity:
          description: 'Quantity (>= 1)'
          type: integer
          example: 2
        taxesAndFees:
          description: 'Tax/fee configuration for this addon'
          type: array
          items:
            $ref: '#/components/schemas/TaxFeeConfigSchema'
        isDefault:
          description: 'Whether this is a default (package) add-on'
          type: boolean
          example: false
      type: object
    CalculateTotalsRequestSchema:
      required:
        - type
        - taxesAndFees
      properties:
        type:
          description: 'Entity type. Determines the calculation strategy.'
          type: string
          enum:
            - reservation
            - product
            - addon
            - custom_item
            - resource
            - room_revenue
            - adjustment
            - manual_tax_fee
          example: product
        taxesAndFees:
          description: 'Array of tax/fee configuration objects. Can be empty.'
          type: array
          items:
            $ref: '#/components/schemas/TaxFeeConfigSchema'
        convenienceFeeConfig:
          oneOf:
            -
              $ref: '#/components/schemas/ConvenienceFeeConfigSchema'
          nullable: true
          description: 'Convenience fee configuration'
        date:
          description: 'Calculation date (YYYY-MM-DD). Used for context and monitoring. Defaults to current date.'
          type: string
          example: '2026-04-01'
          nullable: true
        roundingMethod:
          description: 'Rounding method. 0 = legacy (default), 1 = item-level rounding.'
          type: integer
          example: 0
          nullable: true
        exclusiveTaxesOnTotal:
          description: 'Whether exclusive taxes are calculated on the net rate (after inclusive extraction). Defaults to true.'
          type: boolean
          example: true
        amount:
          oneOf:
            -
              $ref: '#/components/schemas/MoneyInputSchema'
          nullable: true
          description: 'Base amount for entity types. Required for product/addon/custom_item/resource.'
        adults:
          description: 'Number of adults. Used by fixed_per_person. Defaults to 1.'
          type: integer
          example: 1
        children:
          description: 'Number of children. Used by fixed_per_person. Defaults to 0.'
          type: integer
          example: 0
        nights:
          description: 'Number of nights. Used by fixed_per_person, fixed_per_accommodation. Defaults to 1.'
          type: integer
          example: 1
        accommodations:
          description: 'Number of accommodations. Used by fixed_per_accommodation. Defaults to 1.'
          type: integer
          example: 1
        rooms:
          description: 'Room configurations. Required for reservation type. Must be null (not empty array) for entity types.'
          type: array
          items:
            $ref: '#/components/schemas/RoomSchema'
          nullable: true
        currencyCode:
          description: 'ISO 4217 currency code. Required for reservation type. For entity types, derived from amount.currencyCode.'
          type: string
          example: USD
          nullable: true
        depositConfig:
          oneOf:
            -
              $ref: '#/components/schemas/DepositConfigSchema'
          nullable: true
          description: 'Deposit calculation rules. Reservation type only.'
        allotmentBlockCode:
          description: 'Allotment block code. Reservation type only.'
          type: string
          nullable: true
      type: object
    ConvenienceFeeConfigSchema:
      required:
        - name
        - rate
        - rateType
        - mode
      properties:
        name:
          description: 'Display name for the surcharge'
          type: string
          example: 'Credit Card Surcharge'
        rate:
          description: 'Fee rate in minor units. For percentage: the rate in minor units (e.g., "300" = 3.00%).'
          type: string
          example: '300'
        rateType:
          description: 'How the fee is calculated'
          type: string
          enum:
            - percentage
            - fixed
          example: percentage
        mode:
          description: 'Calculation mode. fee_on_top = added to total. fee_from_total = extracted from total.'
          type: string
          enum:
            - fee_on_top
            - fee_from_total
          example: fee_on_top
      type: object
    DateRangeSchema:
      required:
        - range
      properties:
        range:
          description: 'Date range in "start/end" format. Dates can be full (YYYY-MM-DD) or recurring annual (--MM-DD). End date can be omitted for open-ended ranges.'
          type: string
          example: 2026-03-01/2026-03-31
        amount:
          description: 'Override tax/fee amount when this date range matches, in minor currency units (e.g. 1500 = $15.00).'
          type: string
          example: '1500'
          nullable: true
        amountAdult:
          description: 'Override per-adult amount in minor currency units (e.g. 500 = $5.00).'
          type: string
          example: '500'
          nullable: true
        amountChild:
          description: 'Override per-child amount in minor currency units (e.g. 250 = $2.50).'
          type: string
          example: '250'
          nullable: true
        amountRateBased:
          description: 'Override rate-based tiers.'
          type: array
          items:
            $ref: '#/components/schemas/RateBasedTierSchema'
          nullable: true
        maxLength:
          description: 'Override max nights to charge.'
          type: integer
          example: 10
          nullable: true
        lengthOfStay:
          oneOf:
            -
              $ref: '#/components/schemas/LengthOfStaySchema'
          nullable: true
          description: 'Nested length-of-stay rules that apply within this date range.'
      type: object
    DepositConfigSchema:
      required:
        - type
      properties:
        type:
          description: 'How deposit is calculated'
          type: string
          enum:
            - percentage
            - fixed
            - first_night
            - first_night_with_taxes
            - full_stay
            - none
          example: percentage
        value:
          description: 'Deposit value in minor currency units. Required for percentage and fixed types. For percentage: "5000" = 50.00%. For fixed: "5000" = $50.00.'
          type: string
          example: '5000'
          nullable: true
      type: object
    DetailedRateSchema:
      required:
        - date
        - rate
      properties:
        date:
          description: 'Night date (YYYY-MM-DD)'
          type: string
          example: '2026-04-01'
        rate:
          description: 'Base room rate for this night in minor currency units (e.g. 15000 = $150.00)'
          type: string
          example: '15000'
        adults:
          description: 'Adult surcharge for this night in minor currency units (e.g. 2500 = $25.00)'
          type: string
          example: '2500'
        children:
          description: 'Child surcharge for this night in minor currency units (e.g. 1000 = $10.00)'
          type: string
          example: '1000'
      type: object
    FeeSchema:
      description: 'A fee row applied to a parent object (today: a check line item). Same model as itemTaxes — fees are referenced by ID from the property''s configured fees catalog, not by free-text name. Multiple fee rows per parent are supported, and each fee can carry its own `taxes[]` for tax-on-fee.'
      required:
        - feeId
        - feeValue
      properties:
        feeId:
          description: 'Fee identifier — the partner-owned `external_id` configured on the fee under the property''s fee settings (a 3rd-party reference the property has associated with one of its Cloudbeds fees). Must resolve to an active fee on the property; unknown or inactive identifiers are rejected with FEE_ID_NOT_FOUND. The internal Cloudbeds numeric fee id is not accepted as input — it is unstable across property-side fee edits.'
          type: string
          example: fee_resort_daily
        feeValue:
          oneOf:
            -
              $ref: '#/components/schemas/MoneyInputSchema'
          nullable: true
          description: 'Fee amount applied to this item, in the property currency.'
        taxes:
          description: 'Taxes applied to this fee (tax-on-fee). Each taxId must match an active tax configured on the property; unknown / inactive ids are rejected with TAX_ID_NOT_FOUND. Schema reused from the Gratuity domain.'
          type: array
          items:
            $ref: '#/components/schemas/TaxSchema'
      type: object
    LengthOfStayRangeSchema:
      required:
        - minimumNights
      properties:
        minimumNights:
          description: 'Minimum nights for this range to apply (inclusive).'
          type: integer
          example: 1
        maximumNights:
          description: 'Maximum nights for this range (inclusive). Null means no upper limit.'
          type: integer
          example: 28
          nullable: true
        amount:
          description: 'Override tax/fee amount for this range, in minor currency units (e.g. 1000 = $10.00).'
          type: string
          example: '1000'
          nullable: true
        amountAdult:
          description: 'Override per-adult amount for this range, in minor currency units (e.g. 500 = $5.00).'
          type: string
          example: '500'
          nullable: true
        amountChild:
          description: 'Override per-child amount for this range, in minor currency units (e.g. 250 = $2.50).'
          type: string
          example: '250'
          nullable: true
        amountRateBased:
          description: 'Override rate-based tiers for this range.'
          type: array
          items:
            $ref: '#/components/schemas/RateBasedTierSchema'
          nullable: true
        maxLength:
          description: 'Override max nights to charge for per-person taxes.'
          type: integer
          example: 10
          nullable: true
      type: object
    LengthOfStaySchema:
      required:
        - applicationType
        - ranges
      properties:
        applicationType:
          description: 'How length-of-stay rules are applied. "progressive_application" applies per-night based on which night it is. "retroactive_adjustment" applies uniformly based on total stay length.'
          type: string
          enum:
            - progressive_application
            - retroactive_adjustment
          example: progressive_application
        ranges:
          description: 'Length-of-stay ranges. Each range defines amount overrides for a night count bracket.'
          type: array
          items:
            $ref: '#/components/schemas/LengthOfStayRangeSchema'
      type: object
    MoneyInputSchema:
      required:
        - amount
        - currencyCode
      properties:
        amount:
          description: 'Amount in the smallest representable units of the currency (e.g., cents for USD)'
          type: string
          example: '10000'
        currencyCode:
          description: 'ISO 4217 currency code'
          type: string
          example: USD
      type: object
    RateBasedTierSchema:
      required:
        - rate
        - percentage
      properties:
        rate:
          description: 'Rate threshold in minor currency units. Tax tier applies when the base rate is >= this value (e.g. 15000 = $150.00).'
          type: string
          example: '0'
        percentage:
          description: 'Tax percentage to apply when the rate threshold is met, in minor units (e.g. 1000 = 10.00%).'
          type: string
          example: '1000'
      type: object
    RoomSchema:
      required:
        - startDate
        - endDate
        - adults
        - children
        - detailedRates
      properties:
        roomTypeId:
          description: 'Room type ID for per-room-type tax filtering'
          type: string
          example: '101'
          nullable: true
        startDate:
          description: 'Check-in date (YYYY-MM-DD)'
          type: string
          example: '2026-04-01'
        endDate:
          description: 'Check-out date (YYYY-MM-DD)'
          type: string
          example: '2026-04-03'
        adults:
          description: 'Number of adults (>= 1)'
          type: integer
          example: 2
        children:
          description: 'Number of children (>= 0)'
          type: integer
          example: 1
        rateId:
          description: 'Rate plan ID (context only)'
          type: string
          example: '456'
          nullable: true
        detailedRates:
          description: 'Per-night rate breakdown. One entry per night of the stay.'
          type: array
          items:
            $ref: '#/components/schemas/DetailedRateSchema'
        addons:
          description: 'Add-ons to include in calculation'
          type: array
          items:
            $ref: '#/components/schemas/AddonSchema'
          nullable: true
      type: object
    TaxFeeConfigSchema:
      required:
        - id
        - name
        - category
        - calculationType
        - value
        - taxTreatment
      properties:
        id:
          description: 'Unique identifier within the request'
          type: string
          example: '101'
        name:
          description: 'Display name'
          type: string
          example: 'VAT 10%'
        category:
          description: 'Whether this is a tax or a fee'
          type: string
          enum:
            - tax
            - fee
          example: tax
        calculationType:
          description: 'How the amount is calculated'
          type: string
          enum:
            - percentage
            - percentage_rate_based
            - fixed
            - fixed_per_person
            - fixed_per_accomodation
            - fixed_per_reservation
          example: percentage
        value:
          description: 'Rate or amount value in minor units. For percentage types: the percentage in minor units (e.g., "1000" = 10.00%). For fixed types: the amount in minor currency units (e.g., "1500" = $15.00).'
          type: string
          example: '1000'
        taxTreatment:
          description: 'How this tax/fee relates to the base amount'
          type: string
          enum:
            - inclusive
            - exclusive
          example: exclusive
        appliedTo:
          description: 'Application targets — where the tax/fee gets applied. A tax with `appliedTo=["rate","fee"]` is applied both to the base rate AND to each parent of type "fee". Defaults are derived from `category` + `parents` when omitted: a fee → `["rate"]`; a tax with no parent → `["rate"]`; a tax with a `fee` parent → `["fee"]`; a tax with a `tax` parent → `["tax"]`.'
          type: array
          items:
            type: string
            enum:
              - product
              - rate
              - payment
              - fee
              - source
              - sub_source
              - room_revenue
              - custom_item
              - tax
          example:
            - rate
          nullable: true
        parents:
          description: 'Compound parents (tax-on-fee, tax-on-tax). A tax may reference multiple parents.'
          type: array
          items:
            $ref: '#/components/schemas/TaxFeeParentSchema'
          nullable: true
        parentId:
          description: 'Deprecated — use `parents` instead. Single parent ID for tax-on-fee or tax-on-tax. Kept for backward compatibility; when set (and `parents` is omitted) it is mapped to a single-element `parents` list.'
          type: string
          nullable: true
          deprecated: true
        parentKind:
          description: 'Deprecated — use `parents` instead. Kind of the legacy `parentId` parent.'
          type: string
          enum:
            - tax
            - fee
          nullable: true
          deprecated: true
        roomTypeIds:
          description: 'Room type IDs this tax/fee applies to. Empty means all room types.'
          type: array
          items:
            type: string
          nullable: true
        typeSettings:
          oneOf:
            -
              $ref: '#/components/schemas/TypeSettingsSchema'
          nullable: true
          description: 'Additional type settings (length-of-stay rules, date ranges, per-person amounts, rate-based tiers).'
      type: object
    TaxFeeParentSchema:
      description: "Compound parent reference — points to another tax (tax-on-tax) or fee (tax-on-fee)\nin the same request. A tax row may carry multiple parents (e.g. taxed on both a\nparent fee AND a parent tax); see `TaxFeeConfigSchema::$parents`."
      required:
        - id
        - kind
      properties:
        id:
          description: 'ID of the parent tax or fee (must match an `id` in the same request).'
          type: string
          example: '101'
        kind:
          description: 'Whether the parent is a tax or a fee.'
          type: string
          enum:
            - tax
            - fee
          example: fee
      type: object
    TaxSchema:
      description: 'A tax row applied to a gratuity, an item, or a service charge. Multiple tax rows per parent object are supported.'
      required:
        - taxId
        - taxValue
      properties:
        taxId:
          description: 'Tax identifier — the partner-owned `external_id` configured on the tax under the property''s tax settings (a 3rd-party reference the property has associated with one of its Cloudbeds taxes). Must resolve to an active tax on the property; unknown or inactive identifiers are rejected with TAX_ID_NOT_FOUND. The internal Cloudbeds numeric tax id is not accepted as input — it is unstable across property-side tax edits.'
          type: string
          example: tax_state_va_8
        taxValue:
          oneOf:
            -
              $ref: '#/components/schemas/MoneyInputSchema'
          nullable: true
          description: 'Tax amount applied to the gratuity (in property currency).'
      type: object
    TypeSettingsSchema:
      description: "Additional type settings for tax/fee calculation.\nAll properties are optional — only provide what applies to the specific tax/fee."
      properties:
        amountAdult:
          description: 'Per-adult fixed amount in minor currency units (e.g. 1000 = $10.00). Used with fixed_per_person calculation type when adults and children have different rates.'
          type: string
          example: '1000'
          nullable: true
        amountChild:
          description: 'Per-child fixed amount in minor currency units (e.g. 500 = $5.00). Used with fixed_per_person calculation type when adults and children have different rates.'
          type: string
          example: '500'
          nullable: true
        amountRateBased:
          description: 'Rate-based percentage tiers. Required for percentage_rate_based calculation type. Each tier defines a rate threshold and the tax percentage to apply when the base rate meets it.'
          type: array
          items:
            $ref: '#/components/schemas/RateBasedTierSchema'
          nullable: true
        maxLength:
          description: 'Maximum number of nights to charge for per-person taxes. When set, per-person taxes stop accruing after this many nights per guest.'
          type: integer
          example: 28
          nullable: true
        dateRanges:
          description: 'Date ranges with amount overrides. When present, the tax/fee only applies on nights that fall within a matching range, using the range''s overridden amounts. If no range matches a given night, the tax/fee is excluded for that night.'
          type: array
          items:
            $ref: '#/components/schemas/DateRangeSchema'
          nullable: true
        lengthOfStay:
          oneOf:
            -
              $ref: '#/components/schemas/LengthOfStaySchema'
          nullable: true
          description: 'Length-of-stay rules that override amounts based on the number of nights.'
      type: object
    CalculateTotalsResponseSchema:
      required:
        - type
        - netAmount
        - subtotal
        - inclusiveTaxesAndFees
        - exclusiveTaxesAndFees
        - taxes
        - fees
        - total
        - paymentTotal
        - currencyCode
      properties:
        type:
          description: 'Echoed from request'
          type: string
          example: reservation
        netAmount:
          $ref: '#/components/schemas/MoneySchema'
        subtotal:
          $ref: '#/components/schemas/MoneySchema'
        inclusiveTaxesAndFees:
          $ref: '#/components/schemas/MoneySchema'
        exclusiveTaxesAndFees:
          $ref: '#/components/schemas/MoneySchema'
        taxes:
          $ref: '#/components/schemas/TaxFeeBreakdownResponseSchema'
        fees:
          $ref: '#/components/schemas/TaxFeeBreakdownResponseSchema'
        total:
          $ref: '#/components/schemas/MoneySchema'
        convenienceFee:
          oneOf:
            -
              $ref: '#/components/schemas/ConvenienceFeeResponseSchema'
          nullable: true
          description: 'Convenience fee details'
        paymentTotal:
          $ref: '#/components/schemas/MoneySchema'
        currencyCode:
          description: 'ISO 4217 currency code'
          type: string
          example: USD
        deposit:
          oneOf:
            -
              $ref: '#/components/schemas/MoneySchema'
          nullable: true
          description: 'Calculated deposit amount. Reservation only.'
        balanceDue:
          oneOf:
            -
              $ref: '#/components/schemas/MoneySchema'
          nullable: true
          description: 'total - deposit. Reservation only.'
        defaultAddonsTotal:
          oneOf:
            -
              $ref: '#/components/schemas/MoneySchema'
          nullable: true
          description: 'Total of default (package) add-ons. Reservation only.'
        requestedAddonsTotal:
          oneOf:
            -
              $ref: '#/components/schemas/MoneySchema'
          nullable: true
          description: 'Total of explicitly requested add-ons. Reservation only.'
        rooms:
          description: 'Per-room totals breakdown. Reservation only.'
          type: array
          items:
            $ref: '#/components/schemas/RoomTotalsResponseSchema'
          nullable: true
      type: object
    ConvenienceFeeResponseSchema:
      required:
        - name
        - amount
        - rate
        - rateType
        - mode
      properties:
        name:
          description: 'Display name (echoed)'
          type: string
          example: 'Credit Card Surcharge'
        amount:
          $ref: '#/components/schemas/MoneySchema'
        rate:
          description: 'Fee rate (echoed)'
          type: string
          example: '3.00'
        rateType:
          description: 'How calculated (echoed)'
          type: string
          enum:
            - percentage
            - fixed
          example: percentage
        mode:
          description: 'Mode used (echoed)'
          type: string
          enum:
            - fee_on_top
            - fee_from_total
          example: fee_on_top
      type: object
    RoomTotalsResponseSchema:
      required:
        - totalWithoutTaxes
        - totalFirstNightWithoutTaxes
        - taxesAndFees
        - taxesAndFeesFirstNight
      properties:
        totalWithoutTaxes:
          $ref: '#/components/schemas/MoneySchema'
        totalFirstNightWithoutTaxes:
          $ref: '#/components/schemas/MoneySchema'
        taxesAndFees:
          $ref: '#/components/schemas/MoneySchema'
        taxesAndFeesFirstNight:
          $ref: '#/components/schemas/MoneySchema'
      type: object
    TaxFeeBreakdownResponseSchema:
      required:
        - total
        - items
      properties:
        total:
          $ref: '#/components/schemas/MoneySchema'
        items:
          description: 'Individual line items'
          type: array
          items:
            $ref: '#/components/schemas/TaxFeeItemResponseSchema'
      type: object
    TaxFeeItemResponseSchema:
      required:
        - id
        - name
        - amount
        - taxTreatment
      properties:
        id:
          description: 'Tax/fee ID (echoed)'
          type: string
          example: '101'
        name:
          description: 'Display name (echoed)'
          type: string
          example: 'VAT 10%'
        amount:
          $ref: '#/components/schemas/MoneySchema'
        taxTreatment:
          description: 'Tax treatment (echoed)'
          type: string
          enum:
            - inclusive
            - exclusive
          example: exclusive
        parents:
          description: 'Compound parents (tax-on-fee, tax-on-tax). Empty when the row is not a compound tax.'
          type: array
          items:
            $ref: '#/components/schemas/TaxFeeParentResponseSchema'
      type: object
    TaxFeeParentResponseSchema:
      description: "Compound parent reference echoed back on each tax/fee line item — counterpart of the\nrequest-side `TaxFeeParentSchema`."
      required:
        - id
        - kind
      properties:
        id:
          description: 'ID of the parent tax or fee.'
          type: string
          example: '101'
        kind:
          description: 'Whether the parent is a tax or a fee.'
          type: string
          enum:
            - tax
            - fee
          example: fee
      type: object
  parameters:
    roomId:
      name: roomId
      in: path
      description: 'Room ID'
      required: true
      schema:
        type: string
      example: 1-b
  securitySchemes:
    api_key:
      type: apiKey
      name: x-api-key
      in: header
    default:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: 'https://api.cloudbeds.com/auth/oauth/authorize'
          tokenUrl: 'https://api.cloudbeds.com/auth/oauth/token'
          scopes:
            'read:addon': 'Read Addon information'
            'read:doorLockKey': 'Read DoorLock keys and settings'
            'write:doorLockKey': 'Write DoorLock keys and settings'
            'delete:doorLockKey': 'Delete DoorLock keys and settings'
            'read:housekeeping': 'Read Housekeeping inspections'
            'read:marketsegment': 'Read Market Segmentation groups and segments'
            'write:marketsegment': 'Write Market Segmentation groups and segments'
            'delete:marketsegment': 'Delete Market Segmentation groups and segments'
            'write:importTask': 'Create new data imports'
            'read:importTask': 'Read data imports'
            'hotel:read': 'Read Hotel information'
            'hotel:write': 'Write Hotel information'
            'hotel:delete': 'Delete Hotel information'
            'write:appError': 'Write AppError information'
            'read:agePolicy': 'Read Age Policy information'
            'write:agePolicy': 'Write Age Policy information'
            'delete:agePolicy': 'Delete Age Policy information'
            'write:allotmentBlocks': 'Write AllotmentBlock information'
            'read:allotmentBlocks': 'Read AllotmentBlock information'
            'delete:allotmentBlocks': 'Delete AllotmentBlock information'
