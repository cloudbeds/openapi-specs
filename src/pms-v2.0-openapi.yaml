    DeleteGratuityRequestSchema:
      required:
        - gratuityId
      properties:
        gratuityId:
          description: 'The public gratuityId of the gratuity to void (as returned at post time). Voids that single gratuity and its tax children.'
          type: string
      type: object
    GratuitySchema:
      description: 'A single tip entry. Recipient is optional; absent recipient is allowed.'
      required:
        - amount
      properties:
        amount:
          oneOf:
            -
              $ref: '#/components/schemas/MoneyInputSchema'
          nullable: true
          description: 'Gratuity amount in the property currency. Must be > 0; corrections require void + repost (negative amounts rejected).'
        taxes:
          description: 'Optional tax rows applied to this gratuity. Each tax follows the item-tax pattern; an unknown taxId returns TAX_ID_NOT_FOUND.'
          type: array
          items:
            $ref: '#/components/schemas/TaxSchema'
        note:
          description: 'Free-text label displayed on the folio line item.'
          type: string
          example: 'Tip for Maria'
          nullable: true
        customTransactionCode:
          description: 'Override the property default Custom Transaction Code for this posting.'
          type: string
          example: GRT-VIP
          nullable: true
        generalLedgerCustomCode:
          description: 'Override the property default GL custom code for this posting.'
          type: string
          example: GL-2410
          nullable: true
        subReservationId:
          description: 'Sub-reservation identifier. If provided, this gratuity entry is routed to the specified sub-reservation within the parent reservation (request-level reservationId). Has no effect when the request-level target is houseAccountId or groupCode.'
          type: string
          example: SUB123
          nullable: true
        recipient:
          oneOf:
            -
              $ref: '#/components/schemas/RecipientSchema'
          nullable: true
          description: 'Recipient attribution. All sub-fields optional; absent recipient is allowed.'
        gratuityId:
          description: 'Optional partner-supplied public handle for this gratuity (accept-or-generate). When omitted, Cloudbeds generates one and returns it. Must be a non-empty string containing only letters, digits, and . _ ~ -, unique among active (non-voided) gratuities on the property; reusable after this gratuity is voided. Used to address the gratuity for void (DELETE /folio/v1/gratuities/{gratuityId}).'
          type: string
          maxLength: 255
          pattern: '^[A-Za-z0-9._~-]+$'
          example: partner-grat-7a3f
          nullable: true
      type: object
    PostCheckGratuityRequestSchema:
      description: "Request body for the nested create endpoint `POST /folio/v1/checks/{checkId}/gratuities`.\n\nLinkage is expressed by the URL: `checkId` is the **path parameter** (documented on the\ncontroller operation, bound by name — NOT a body field), so the body carries only the\ngratuity entries. Retry-safety is the required Idempotency-Key header (referenceId retired).\nIf a client also sends `checkId` in the JSON body, the URL segment wins —\nApiControllerArgumentsResolver merges path params last, so the body value is silently overridden.\nThe gratuities inherit the linked check's folio target and checkNumber; POS context stays an\nattribute of the check (it is not copied onto the gratuity). Contrast the standalone\n`POST /folio/v1/gratuities` request body."
      required:
        - gratuities
      properties:
        gratuities:
          description: 'Gratuity entries to post to the check. At least one entry required. Each entry becomes its own folio line item and its own Accounting Service transaction.'
          type: array
          items:
            $ref: '#/components/schemas/GratuitySchema'
      type: object
    PostGratuityRequestSchema:
      description: 'Request body for the standalone postGratuity endpoint (a tip with no check). Exactly one of reservationId / houseAccountId / groupCode must be provided. Sub-reservation routing is per-gratuity via GratuitySchema.subReservationId. To link tips to a check, use POST /folio/v1/checks/{checkId}/gratuities instead — checkId / checkNumber / POS context are check attributes and are not accepted here.'
      required:
        - gratuities
      properties:
        reservationId:
          description: 'Reservation identifier. Required if houseAccountId and groupCode are not provided.'
          type: string
          example: RES123456
          nullable: true
        houseAccountId:
          description: 'House account identifier. Required if reservationId and groupCode are not provided.'
          type: string
          example: '123456'
          nullable: true
        groupCode:
          description: 'Group code. Required if reservationId and houseAccountId are not provided.'
          type: string
          example: GRP2025
          nullable: true
        folioId:
          description: 'Folio identifier within the chosen account target. Numeric string (the underlying folio_id is a 64-bit unsigned integer). Optional — when omitted, the default folio for the target is used.'
          type: string
          example: '12345'
          nullable: true
        gratuities:
          description: 'Gratuity entries to post. At least one entry required. Each entry becomes its own folio line item and its own Accounting Service transaction.'
          type: array
          items:
            $ref: '#/components/schemas/GratuitySchema'
      type: object
      oneOf:
        -
          required:
            - reservationId
        -
          required:
            - houseAccountId
        -
          required:
            - groupCode
    RecipientSchema:
      description: 'Recipient attribution for a gratuity. All three fields are optional and independent. When more than one is provided, resolution priority is: userId > email > name.'
      properties:
        userId:
          description: 'Cloudbeds user ID; must reference a valid user on the property or RECIPIENT_USER_NOT_FOUND is returned.'
          type: string
          example: usr_4821
          nullable: true
        email:
          description: 'Recipient email; resolved to a user record if userId not provided.'
          type: string
          example: maria.santos@cloudbeds.com
          nullable: true
        name:
          description: 'Free-text recipient name; always stored as a display string regardless of whether a user record is resolved.'
          type: string
          example: 'Maria Santos'
          nullable: true
      type: object
    GratuityErrorCodeEnumSchema:
      description: 'Machine-readable error code returned in BadRequest / Conflict / NotFound responses for postGratuity. Aligned with the structured error approach used by STS Gen2 and the Accounting API.'
      type: string
      enum:
