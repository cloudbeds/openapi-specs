  /folio/v1/checks:
    post:
      tags:
        - Checks
      summary: 'Post a completed POS check (e.g., F&B) to a guest folio, house account, or group profile'
      description: 'Replaces postCustomItem with first-class folio transactions enriched with hospitality POS context (check identity, revenue center, meal period, gratuity, service charge). Items posted via this endpoint are recorded as regular folio items, not Custom Items, and are tagged as POS-originated for UI differentiation.'
      operationId: 'CheckController::createCheck'
      parameters:
        -
          name: x-property-id
          in: header
          description: 'A numeric, comma-separated string representing the property IDs, sent in the header.'
          required: true
          schema:
            type: string
            example: '1,2,3'
        -
          name: Idempotency-Key
          in: header
          description: 'Required per-request idempotency key and the sole dedup key for this endpoint: a retry carrying the same key and the same payload replays the original posting (notice populated); the same key with a different payload is rejected with IDEMPOTENCY_KEY_REUSED. Absent, empty, or whitespace-only → 400.'
          required: true
          schema:
            type: string
            maxLength: 255
            example: req-2026-05-05-2047-9b3f
      requestBody:
        description: 'Check details: account target, line items, optional gratuities, service charge, discounts and payments.'
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostCheckRequestSchema'
      responses:
        '201':
          description: 'Check successfully posted. The response includes the public checkId (for downstream void/reversal) and the resolved checkNumber.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostCheckResponseSchema'
        '400':
          description: 'Bad request — missing/oversized Idempotency-Key header, invalid parameters, validation failures, or unmatched tax/fee IDs. See CheckErrorCodeEnumSchema for the structured error codes returned in the body.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponseSchema'
        '403':
          description: 'Forbidden — insufficient permissions on the requested property.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponseSchema'
        '404':
          description: 'Not found — reservation, house account, group, or folio not found.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponseSchema'
        '409':
          description: 'Conflict — see CheckErrorCodeEnumSchema for the structured codes: IDEMPOTENCY_KEY_REUSED (Idempotency-Key header reused with a different payload), PRODUCT_NAME_CONFLICT (line''s name collides with an existing active product that has a different SKU).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictResponseSchema'
        '500':
          description: 'Internal server error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponseSchema'
      security:
        -
          default:
            - 'write:item'
  '/folio/v1/checks/{checkId}':
    delete:
      tags:
        - Checks
      summary: 'Void a posted check end-to-end (ledger + payments + its gratuities) by its checkId'
      description: 'Voids the whole check: reverses each line (item / service charge / discount) and its tax/fee children on both CDC and DOMAIN, cascade-voids every gratuity linked to the check (each with its own tax children), and voids the anchored payments via the payments service. Idempotent — voiding an already-voided check returns 204.'
      operationId: 'CheckController::deleteCheck'
      parameters:
        -
          name: x-property-id
          in: header
          description: 'A numeric, comma-separated string representing the property IDs, sent in the header.'
          required: true
          schema:
            type: string
            example: '1,2,3'
        -
          name: checkId
          in: path
          description: 'The check''s public checkId (partner-supplied or Cloudbeds-generated) returned by createCheck.'
          required: true
          schema:
            type: string
      responses:
        '204':
          description: 'Check voided (or already voided — idempotent).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoContentResponseSchema'
        '403':
          description: 'Forbidden — insufficient permissions on the requested property.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponseSchema'
        '404':
          description: 'Not found — no check matches the checkId on this property (CHECK_NOT_FOUND).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponseSchema'
        '409':
          description: 'Conflict — the check''s folio target was never persisted (pre-feature posting) (CHECK_VOID_UNAVAILABLE).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictResponseSchema'
        '500':
          description: 'Internal server error — ledger void completed but one or more payment voids failed (PAYMENT_VOID_FAILED). Retry to converge.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponseSchema'
      security:
        -
          default:
            - 'write:item'
