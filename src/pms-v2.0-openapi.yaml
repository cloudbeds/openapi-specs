        - FOLIO_NOT_FOUND
        - TAX_ID_NOT_FOUND
        - RECIPIENT_USER_NOT_FOUND
        - SUBRESERVATION_NOT_FOUND
        - CHECK_NOT_FOUND
        - DUPLICATE_REFERENCE
        - IDEMPOTENCY_KEY_REUSED
        - GRATUITY_NOT_FOUND
        - GRATUITY_VOID_UNAVAILABLE
