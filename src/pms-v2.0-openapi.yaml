          description: 'Required per-request idempotency key and the sole dedup key for this endpoint: a retry carrying the same key and the same payload replays the original posting (notice populated); the same key with a different payload is rejected with IDEMPOTENCY_KEY_REUSED. Absent, empty, or whitespace-only → 400.'
          required: true
          schema:
            type: string
            maxLength: 255
            example: req-2026-05-05-2047-9b3f
      requestBody:
        description: 'Gratuity posting request: folio target and one or more gratuity entries.'
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostGratuityRequestSchema'
      responses:
        '201':
          description: 'Gratuity successfully posted. Returns the Cloudbeds-assigned gratuityId for each posted gratuity and notice=null.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostGratuityResponseSchema'
        '400':
          description: 'Bad request — missing/oversized Idempotency-Key header, validation failure, unmatched taxId, unknown recipient userId, or an unresolvable folio target. See GratuityErrorCodeEnumSchema for structured error codes.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponseSchema'
        '403':
          description: 'Forbidden — insufficient permissions on the requested property.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponseSchema'
        '409':
          description: 'Conflict — see GratuityErrorCodeEnumSchema for the structured codes: IDEMPOTENCY_KEY_REUSED (Idempotency-Key reused with a different payload) or DUPLICATE_GRATUITY_ID (a partner-supplied gratuityId collides with an active gratuity).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictResponseSchema'
        '500':
          description: 'Internal server error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponseSchema'
      security:
        -
          default:
            - 'write:item'
