        - intervals
      properties:
        roomTypeId:
          description: 'Room Type ID.'
          type: integer
          example: 12345
        intervals:
          description: 'Date intervals to set.'
          type: array
          items:
            $ref: '#/components/schemas/PutIntervalRequestSchema'
      type: object
    PatchIntervalRequestSchema:
      required:
        - startDate
        - endDate
        - amountAllottedForSaleDelta
      properties:
        startDate:
          description: 'Interval start date (YYYY-MM-DD).'
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          example: '2030-01-01'
        endDate:
          description: 'Interval end date (YYYY-MM-DD), inclusive.'
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          example: '2030-01-07'
        amountAllottedForSaleDelta:
          description: 'Relative change (must be non-zero; may be negative; result is floored at 0).'
          type: integer
          example: -2
          nullable: true
      type: object
    PutIntervalRequestSchema:
      required:
        - startDate
        - endDate
        - amountAllottedForSale
      properties:
        startDate:
          description: 'Interval start date (YYYY-MM-DD).'
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          example: '2030-01-01'
        endDate:
          description: 'Interval end date (YYYY-MM-DD), inclusive.'
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          example: '2030-01-07'
        amountAllottedForSale:
          description: 'New amount allotted for sale (>= 0).'
          type: integer
          example: 10
          nullable: true
      type: object
    AmountsForSaleListResponseSchema:
      required:
        - data
      properties:
        data:
          description: 'Per-date amounts allotted for sale.'
          type: array
          items:
            $ref: '#/components/schemas/DateAmountResponseSchema'
      type: object
    DateAmountResponseSchema:
      required:
        - date
        - amountAllottedForSale
      properties:
        date:
          description: 'Date (YYYY-MM-DD).'
          type: string
          example: '2030-01-01'
        amountAllottedForSale:
          description: 'Operator-set amount allotted for sale.'
          type: integer
          example: 12
      type: object
    JobAcceptedResponseSchema:
      required:
        - jobReferenceId
      properties:
        jobReferenceId:
          description: 'Reference ID for tracking via getAsyncApiJob.'
          type: integer
          example: 1234
      type: object
    AssignableRoomsRequestSchema:
      properties:
        roomTypeId:
          description: 'Scope rates and rooms to this room type. Absent returns the reservation''s current type.'
          type: string
          example: '713'
          nullable: true
      type: object
    AssignableRoomSchema:
      required:
        - roomId
        - name
        - housekeepingStatus
      properties:
        roomId:
          description: 'Composite room id "{roomTypeId}-{roomNumber}" used by the reassign action.'
          type: string
          example: 713-2
        name:
          type: string
          example: 'Room 201'
        housekeepingStatus:
          description: 'Housekeeping status key.'
          type: string
          enum:
            - clean
            - dirty
            - inspected
          example: clean
      type: object
    AssignableRoomsResponseSchema:
      required:
        - reservation
        - roomTypes
        - selectedRoomTypeId
        - rates
        - rooms
      properties:
        reservation:
          $ref: '#/components/schemas/ReservationContextSchema'
        roomTypes:
          description: 'Selectable room types (names only, no pricing).'
          type: array
          items:
            $ref: '#/components/schemas/RoomTypeOptionSchema'
        selectedRoomTypeId:
          description: 'The room type the rates and rooms below are scoped to.'
          type: integer
          example: 713
        rates:
          description: 'Rate plans for the selected room type, totalled over the stay.'
          type: array
          items:
            $ref: '#/components/schemas/RatePlanSchema'
        rooms:
          description: 'Rooms of the selected type free for the whole stay. Includes the reservation''s currently-assigned room when the selected type matches its current type (match on reservation.currentRoomId), so the drawer can render it as selected.'
          type: array
          items:
            $ref: '#/components/schemas/AssignableRoomSchema'
      type: object
    RatePlanSchema:
      required:
        - rateId
        - rateType
        - name
        - rateTotal
      properties:
        rateId:
          type: integer
          example: 4521
        rateType:
          description: 'standard | derived | package | allotment'
          type: string
          example: standard
        name:
          type: string
          example: 'Deluxe King Room'
        rateTotal:
          description: 'Total for the stay (sum of nightly rates).'
          type: number
          format: float
          example: 320
        packageId:
          type: integer
          example: null
          nullable: true
        packageName:
          type: string
          example: null
          nullable: true
      type: object
    ReservationContextSchema:
      required:
        - bookingRoomId
        - checkinDate
        - checkoutDate
        - currentRoomTypeId
        - currentRateId
        - originalRateTotal
      properties:
        bookingRoomId:
          type: integer
          example: 123456
        checkinDate:
          type: string
          format: date
          example: '2026-04-04'
        checkoutDate:
          type: string
          format: date
          example: '2026-04-06'
        currentRoomTypeId:
          type: integer
          example: 713
        currentRoomId:
          description: 'Composite room id "{roomTypeId}-{roomNumber}", or null when no room is assigned.'
          type: string
          example: 713-2
          nullable: true
        currentRateId:
          type: integer
          example: 4521
        originalRateTotal:
          type: number
          format: float
          example: 320
        allotmentBlockCode:
          description: 'Allotment block code the reservation belongs to, if any.'
          type: string
          nullable: true
      type: object
    RoomTypeOptionSchema:
      required:
        - id
        - name
      properties:
        id:
          type: integer
          example: 713
        name:
          type: string
          example: 'Deluxe King Room'
      type: object
    ValidationErrorFieldSchema:
      required:
        - field
        - message
      properties:
        field:
          type: string
          example: roomTypeId
        message:
          type: string
          example: 'Room type 999 is not valid for this property.'
      type: object
    ValidationErrorResponseSchema:
      required:
        - message
        - code
      properties:
        message:
          type: string
          example: 'Room type 999 is not valid for this property.'
        code:
          description: 'Machine-readable error code.'
          type: string
          enum:
            - INVALID_ROOM_TYPE
            - RESERVATION_NOT_REASSIGNABLE
          example: INVALID_ROOM_TYPE
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ValidationErrorFieldSchema'
      type: object
    CheckDiscountRequestSchema:
      description: 'A discount applied to the check. Check-level discounts (no `appliesToItem`) post as a distinct negative folio line. Item-level discounts (`appliesToItem` set) are folded into the target item: the item''s amount is reduced by the discount value and the discount description is appended to the item''s note so it remains visible on the folio.'
      required:
        - amount
        - name
        - code
      properties:
        amount:
          oneOf:
            -
              $ref: '#/components/schemas/MoneyInputSchema'
          nullable: true
          description: 'Discount amount as a positive value in the property currency. Cloudbeds posts it as a negative folio line.'
        name:
          description: 'Human-readable label displayed on the folio line.'
          type: string
          example: 'Happy Hour 20%'
        code:
          description: 'Partner-supplied code identifying the discount (e.g., promotion or coupon code).'
          type: string
          example: HAPPY_HOUR
        note:
          description: 'Optional free-text note attached to the discount line item.'
          type: string
          example: 'Manager comp'
          nullable: true
        appliesToItem:
          description: 'Optional zero-based index into the `items` array on the same postCheck request. When set, the discount is folded into that item: item.amount is reduced by the discount value and the discount description is appended to item.note. When omitted, the discount is check-level and posts as its own folio line.'
          type: integer
          example: 0
          nullable: true
      type: object
    CheckItemDetailsSchema:
      description: 'Marker base for the polymorphic `details` block on a check item. Concrete shape is selected by the sibling `itemType` field — see CheckItemRequestSchema.details.'
      type: object
    CheckItemRequestSchema:
      description: 'A single line on a POS check. Shared envelope fields — itemName, itemQuantity, itemPrice, itemAmount, itemTaxes, itemFees, itemNote, customTransactionCode, generalLedgerCustomCode — describe the line. itemQuantity is the unit count; itemPrice, when supplied, is the per-unit rate but is informational metadata only. The `details` block is polymorphic: its concrete shape is selected by the `itemType` discriminator. Today only PRODUCT is accepted, so `details` carries product-specific fields (sku, category, sub-reservation routing). Bookable-resource details will land alongside as a second `oneOf` branch when that flow is reintroduced. itemAmount is the financial source of truth — the server posts it verbatim without recomputing from itemPrice * itemQuantity.'
      required:
        - itemType
        - itemName
        - itemQuantity
        - itemAmount
        - details
      properties:
        itemType:
          description: 'Discriminator selecting the kind of line — see CheckItemTypeEnum.'
          type: string
          enum:
            - PRODUCT
          example: PRODUCT
        itemName:
          description: 'Human-readable line name displayed on the folio (dish or beverage name).'
          type: string
          example: Cheeseburger
        itemQuantity:
          description: 'Number of units. Informational metadata only — not used for accounting math (itemAmount is the line total, not itemPrice * itemQuantity).'
          type: integer
          example: 2
        itemPrice:
          oneOf:
            -
              $ref: '#/components/schemas/MoneyInputSchema'
          nullable: true
          description: 'Per-unit price in the property currency. Optional informational metadata — recorded on the folio for display and reporting; not used for accounting math. itemAmount is the financial source of truth for this line; when itemPrice is omitted, itemAmount is used as the per-unit price on the folio row.'
        itemAmount:
          oneOf:
            -
              $ref: '#/components/schemas/MoneyInputSchema'
          nullable: true
          description: 'Total line amount in the property currency — the financial source of truth for this line. The server posts this value to the folio without recomputing it from itemPrice * itemQuantity.'
        itemNote:
          description: 'Optional free-text note for this line (modifier, allergen, special request).'
          type: string
          example: 'No onions'
          nullable: true
        customTransactionCode:
          description: 'Custom Transaction Code (chart-of-accounts mapping) snapshotted onto the folio transaction at posting time. If omitted, the property''s default mapping is applied.'
          type: string
          example: FOOD-REVENUE
          nullable: true
        generalLedgerCustomCode:
          description: 'General Ledger custom code, snapshotted onto the folio transaction at posting time. If omitted, the property''s default mapping is applied.'
          type: string
          example: GL-4100
          nullable: true
        itemTaxes:
          description: 'Tax rows for this line, keyed by the property''s configured tax IDs. Cloudbeds maps each entry to an existing tax record on the property; unknown taxIds are rejected. Schema reused from the Gratuity domain.'
          type: array
          items:
            $ref: '#/components/schemas/TaxSchema'
        itemFees:
          description: 'Fee amounts for this line, keyed by the property''s configured fee IDs.'
          type: array
          items:
            $ref: '#/components/schemas/FeeSchema'
        details:
          oneOf:
            -
              $ref: '#/components/schemas/ProductDetailsSchema'
          nullable: true
          description: 'Type-specific block. Concrete shape is selected by the sibling `itemType` field — today PRODUCT → ProductDetailsSchema (sku, category, sub-reservation routing). Additional branches (e.g. bookable resource) will be added as further `oneOf` variants without renaming. A formal OpenAPI `discriminator` is not declared because the discriminator field lives on the parent schema, not inside each variant — out of spec for discriminator.propertyName. Server-side dispatch into the right variant is handled by CheckItemRequestSchemaDenormalizer.'
      type: object
    CheckItemTypeEnum:
      description: 'Line item kind — also the discriminator that selects the concrete shape of the `details` block on the same item. Currently only PRODUCT is accepted (ordinary POS items: food / beverage / retail), and `details` is a ProductDetailsSchema. BOOKABLE_RESOURCE will be reintroduced once the bookable-resource service exposes the synchronous create-reservation RPC postCheck needs to route those lines.'
      type: string
      enum:
        - PRODUCT
    CheckPaymentRequestSchema:
      required:
        - paymentType
        - amount
      properties:
        paymentType:
          description: 'Payment method type. Use the getPaymentMethods API to retrieve available payment methods for the property.'
          type: string
          example: cash
        amount:
          oneOf:
            -
              $ref: '#/components/schemas/MoneyInputSchema'
          nullable: true
          description: 'Payment amount in the property currency.'
        cardType:
          description: 'Card type, when paymentType is a card. Optional.'
          type: string
          example: visa
          nullable: true
        notes:
          description: 'Optional payment notes'
          type: string
          example: 'Paid at checkout'
          nullable: true
      type: object
    CheckServiceChargeRequestSchema:
      description: 'Service charge associated with the check. Posted as a distinct folio line item, separate from items[] and gratuity. Reported and routed independently from food/beverage revenue.'
      required:
        - amount
      properties:
        amount:
          oneOf:
            -
              $ref: '#/components/schemas/MoneyInputSchema'
          nullable: true
          description: 'Service charge amount in the property currency.'
        taxes:
          description: 'Tax rows applied to the service charge. Each row references a property-configured tax by ID. Schema reused from the Gratuity domain.'
          type: array
          items:
            $ref: '#/components/schemas/TaxSchema'
        customTransactionCode:
          description: 'Override the property''s default service-charge Custom Transaction Code for this posting. If omitted, the property''s configured default applies.'
          type: string
          example: SVC-CHRG-VIP
          nullable: true
        generalLedgerCustomCode:
          description: 'Override the property''s default service-charge General Ledger code for this posting. If omitted, the property''s configured default applies.'
          type: string
          example: GL-2410
          nullable: true
        note:
          description: 'Optional free-text note attached to the service charge line item.'
          type: string
          example: '20% mandatory service charge'
          nullable: true
      type: object
    CheckTotalsSchema:
      description: 'Partner-supplied check totals broken out by component. Used for two purposes: (1) totals-only postings — when items[] is empty, itemsSubtotal carries the items subtotal and the server posts a single synthetic items folio line; inline serviceCharge / discounts[] continue to write their own rows; (2) cross-validation — when items[] is also supplied, each total field cross-validates against the corresponding server-computed sum (items / SC / gratuity / discount / tax / fees). Mismatches surface as INVALID_TOTAL_MISMATCH with the failing component identified. totalTax / totalFees are cross-cutting aggregates: in items mode they cross-validate the sum across the whole check; in totals-only mode the partner amount routes to the per-property "Default POS tax" / "Default POS fee" catch-all catalog records (lazy-created), keeping the ledger invariant that every tax_id / fee_id reference resolves to a real row.'
      required:
        - itemsSubtotal
      properties:
        itemsSubtotal:
          oneOf:
            -
              $ref: '#/components/schemas/MoneyInputSchema'
          nullable: true
          description: 'Items subtotal — sum of items[].itemAmount + items[].itemTaxes + items[].itemFees. When items[] is supplied alongside, this value must equal the server-computed items subtotal within 1 minor unit per currency. When items[] is empty, this is the gross figure the synthetic pos_check_total folio line carries. Not a grand-total — service charge, gratuity, and discount totals are reported in their own fields below.'
        totalServiceCharge:
          oneOf:
            -
              $ref: '#/components/schemas/MoneyInputSchema'
          nullable: true
          description: 'Service-charge subtotal — serviceCharge.amount + sum(serviceCharge.taxes). Optional; cross-validates against the inline serviceCharge data ONLY when both are supplied. In totals-only mode without inline serviceCharge, this value is the partner-declared SC aggregate (validation deferred to the persistence layer).'
        totalGratuity:
          oneOf:
            -
              $ref: '#/components/schemas/MoneyInputSchema'
          nullable: true
          description: 'Gratuity subtotal — sum(gratuities[].amount + gratuities[].taxes). Optional; accepted on the wire but server-side validation is deferred until the embedded-gratuity domain handling lands (today gratuities are accepted but not mapped to the domain payload).'
        totalDiscount:
          oneOf:
            -
              $ref: '#/components/schemas/MoneyInputSchema'
          nullable: true
          description: 'Discount subtotal — sum(discounts[].amount), partner-supplied as a positive value. Optional; cross-validates against the inline discounts[] ONLY when both are supplied. In totals-only mode without inline discounts, this value is the partner-declared discount aggregate.'
        totalTax:
          oneOf:
            -
              $ref: '#/components/schemas/MoneyInputSchema'
          nullable: true
          description: 'Total tax across the check — sum of every tax line (items[].itemTaxes, items[].itemFees[].taxes, serviceCharge.taxes, gratuities[].taxes). Optional. When items[] is supplied, the partner value cross-validates against the server-computed sum (INVALID_TOTAL_MISMATCH on drift). In totals-only mode (items[] empty), the partner value is persisted as a single tax line on the synthetic POS-sale item, linked to the property''s lazily-created "Default POS tax" catalog record. Zero or omitted skips the synthesis.'
        totalFees:
          oneOf:
            -
              $ref: '#/components/schemas/MoneyInputSchema'
          nullable: true
          description: 'Total fees across the check — sum of items[].itemFees[].feeValue. Fees only attach to items in the postCheck data model, so the sum is items-scoped. Optional. Same items-mode cross-validation and totals-only synthesis semantics as totalTax, routed through the property''s "Default POS fee" catalog record. Zero or omitted skips the synthesis.'
      type: object
    DeleteCheckRequestSchema:
      required:
        - checkId
      properties:
        checkId:
          description: 'The check''s public checkId (partner-supplied or Cloudbeds-generated) returned by createCheck.'
          type: string
      type: object
    PostCheckRequestSchema:
      description: 'Posts a completed POS check (e.g., F&B) to a guest folio, house account, or group profile. Replaces postCustomItem with first-class folio transactions enriched with hospitality POS context (check identity, revenue center, meal period, gratuity, service charge). All items, itemTaxes, itemFees, gratuities, service charge, discounts, and payments in this request belong to the single check identified by checkNumber/checkId. Multi-check batching is not supported — issue a separate postCheck call per check.'
      properties:
        checkNumber:
          description: 'Partner-assigned check number visible on the customer receipt (e.g., POS terminal display number). Stored on each posted folio line and visible in the folio UI. Optional — when omitted, the server mints a Cloudbeds reference (cb-<id>) and returns it in the response so the partner can echo it back.'
          type: string
          example: '2047'
          nullable: true
        checkId:
          description: 'Partner-assigned durable external reference for the check (UUID or opaque string). Distinct from referenceID — used to correlate the check across systems regardless of retries. Letters, digits, and . _ ~ - only (addressed as a URL path segment for void).'
          type: string
          example: 8f2c1e3a-9b6d-4f1e-9d2a-3b6c0a1f7e51
          nullable: true
        reservationId:
          description: 'Reservation identifier. Required if houseAccountId and groupCode are not provided. Per-item sub-reservation targeting is expressed via items[].subReservationId.'
          type: string
          example: RES123456
          nullable: true
        houseAccountId:
          description: 'House account identifier. Required if reservationId and groupCode are not provided.'
          type: string
          example: HA-99812
          nullable: true
        groupCode:
          description: 'Group code. Required if reservationId and houseAccountId are not provided.'
          type: string
          example: GRP2026
          nullable: true
        folioId:
          description: 'Folio identifier within the chosen account target. Numeric string (the underlying folio_id is a 64-bit unsigned integer). Optional — when omitted, the default folio for the target is used.'
          type: string
          example: '12345'
          nullable: true
        roomId:
          description: 'Room identifier where the charge originated, when applicable.'
          type: string
          example: ROOM-204
          nullable: true
        guestId:
          description: 'Guest identifier. Optional — used for guest-attributed POS reporting.'
          type: string
          example: GST-77123
          nullable: true
        guestName:
          description: 'Guest name as captured at the POS. Used when no guestId is provided.'
          type: string
          example: 'Jane Smith'
          nullable: true
        saleDate:
          description: 'Sale date in RFC 3339 format. If not provided, the current timestamp is used. A future saleDate produces a ''pending'' transaction.'
          type: string
          example: '2026-05-05T20:30:00-04:00'
          nullable: true
        posContext:
          oneOf:
            -
              $ref: '#/components/schemas/PosContextSchema'
          nullable: true
          description: 'Optional POS source metadata for the check (restaurant, revenue center, meal period, staff reference). Inherited by every gratuity, item, and service charge posted as part of this request — embedded gratuities therefore omit their own posContext.'
        coverCount:
          description: 'Number of guests on the check. Used for per-cover F&B reporting.'
          type: integer
          example: 4
          nullable: true
        totals:
          oneOf:
            -
              $ref: '#/components/schemas/CheckTotalsSchema'
          nullable: true
          description: 'Optional partner-supplied totals. Required when items[] is empty (totals-only posting). When supplied alongside items[], the server validates itemsSubtotal against the computed sum and rejects with INVALID_TOTAL_MISMATCH if they disagree (tolerance: 1 minor unit per currency).'
        items:
          description: 'Line items on the check. Each line is posted as a regular folio item, not a Custom Item. At least one of items[] or totals must be supplied — when items[] is empty, totals is required, and the server posts a single folio line carrying totals.itemsSubtotal.'
          type: array
          items:
            $ref: '#/components/schemas/CheckItemRequestSchema'
        gratuities:
          description: 'Optional list of gratuities on the check. Each entry becomes its own folio line item and its own Accounting Service transaction. Use multiple entries when both AUTO_GRATUITY (system-applied) and TIP (voluntary) are present, or when several servers each receive a tip. Embedded gratuities use GratuitySchema (without posContext) — POS context (checkNumber, restaurantName, revenueCenter, mealPeriod, staffReference) is inherited from this parent check.'
          type: array
          items:
            $ref: '#/components/schemas/GratuitySchema'
        serviceCharge:
          oneOf:
            -
              $ref: '#/components/schemas/CheckServiceChargeRequestSchema'
          nullable: true
          description: 'Optional service charge for the check. Posted as a separate folio line item, distinct from gratuity.'
        discounts:
          description: 'Optional discounts applied to the check. Each entry becomes a distinct (negative) folio line item.'
          type: array
          items:
            $ref: '#/components/schemas/CheckDiscountRequestSchema'
        payments:
          description: 'Optional payments to register against the check at posting time. If provided, itemPaid is ignored.'
          type: array
          items:
            $ref: '#/components/schemas/CheckPaymentRequestSchema'
        itemPaid:
          description: 'If true, a cash payment is automatically registered for the full check total (items + taxes + fees + gratuity + service charge - discounts). Ignored when payments[] is provided.'
          type: boolean
          example: false
      type: object
      oneOf:
        -
          required:
            - reservationId
        -
          required:
            - houseAccountId
        -
          required:
            - groupCode
    ProductDetailsSchema:
      description: 'Product-only fields for a check item whose itemType is PRODUCT. itemSku is required — it is the catalog dedup key. Category and sub-reservation override remain optional.'
      required:
        - itemSku
      type: object
      allOf:
        -
          $ref: '#/components/schemas/CheckItemDetailsSchema'
        -
          properties:
            itemSku:
              description: 'Partner-supplied SKU for the item. Required — used as the catalog dedup key and recorded on the folio line for cross-reference.'
              type: string
              example: SKU-CHEESE-001
              nullable: true
            itemCategoryName:
              description: 'Category name as classified by the POS (e.g., ''Food'', ''Beverage'', ''Alcohol''). Used for reporting and item classification.'
              type: string
              example: Food
              nullable: true
            subReservationId:
              description: 'Sub-reservation identifier. If provided, this item is routed to the specified sub-reservation within the parent reservation (request-level reservationId). Has no effect when the request-level target is houseAccountId or groupCode.'
              type: string
              example: SUB123
              nullable: true
          type: object
    CheckErrorCodeEnumSchema:
      description: 'Machine-readable error code returned in BadRequest / NotFound / Conflict responses for postCheck. Aligned with the structured error approach used by STS Gen2 and the Accounting API.'
      type: string
      enum:
        - FOLIO_NOT_FOUND
        - RESERVATION_CHECKED_OUT
        - DUPLICATE_REFERENCE
        - IDEMPOTENCY_KEY_REUSED
        - DUPLICATE_CHECK_ID
        - TAX_ID_NOT_FOUND
        - FEE_ID_NOT_FOUND
        - PRODUCT_NAME_CONFLICT
        - INVALID_TOTAL_MISMATCH
        - MISSING_ITEMS_OR_TOTALS
        - INVALID_CURRENCY_MISMATCH
        - INVALID_TARGET
        - SUBRESERVATION_NOT_FOUND
        - CHECK_NOT_FOUND
        - CHECK_VOID_UNAVAILABLE
        - PAYMENT_VOID_FAILED
    PostCheckResponseSchema:
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/PostedCheckResponseSchema'
      type: object
    PostedCheckResponseSchema:
      description: 'Result of a postCheck call. checkId is the public, partner-addressable handle for the posted check — use it for downstream void/reversal.'
      required:
        - checkNumber
        - checkId
      properties:
        checkNumber:
          description: 'Resolved receipt-visible check number — either the partner-supplied value from the request, or a server-minted Cloudbeds reference (cb-<id>) when the partner omitted it. Always returned so the partner can echo it back.'
          type: string
          example: '2047'
        checkId:
          description: 'Public, partner-addressable check identifier (accept-or-generate): the value the partner supplied, or a Cloudbeds-generated handle when omitted. Use it to address the check for void via DELETE /folio/v1/checks/{checkId}. Always returned.'
          type: string
          example: CHK-9911283
        notice:
          description: 'Set when the request was identified as a duplicate via referenceId. When present, no new posting was created and the original response is returned.'
          type: string
          example: 'Duplicate referenceId detected; original response returned.'
          nullable: true
      type: object
    DynamicFilterFieldSchema:
      description: 'Represents a single filter condition'
      properties:
        field:
          description: 'The field to apply the filter on'
          type: string
          example: checkin_date
        operator:
          $ref: '#/components/schemas/FilterOperatorEnumSchema'
        value:
          description: 'The value for the filter'
          nullable: true
          oneOf:
            -
              type: string
              example: '2023-10-19T00:00:00'
            -
              type: string
              format: date-time
              example: '2023-10-19T00:00:00'
            -
              type: string
              format: date
              example: '2023-10-19'
            -
              type: integer
              example: 42
            -
              type: boolean
              example: true
            -
              type: array
              items:
                type: string
              example:
                - cancelled
                - disabled
            -
              type: array
              items:
                type: integer
              example:
                - 1
                - 2
                - 3
            -
              type: array
              items:
                type: string
                format: date
              example:
                - '2023-10-19'
                - '2023-10-20'
            -
              type: array
              items:
                type: string
                format: date-time
              example:
                - '2023-10-19T00:00:01'
                - '2023-10-19T23:59:09'
      type: object
    DynamicFilterSchema:
      description: 'Represents a logical group of filters with keys like ''and'' or ''or'''
      properties:
        and:
          description: 'Logical operator grouping filters or nested logical groups'
          type: array
          items:
            oneOf:
              -
                $ref: '#/components/schemas/DynamicFilterFieldSchema'
              -
                $ref: '#/components/schemas/DynamicFilterSchema'
        or:
          description: 'Logical operator grouping filters or nested logical groups'
          type: array
          items:
            oneOf:
              -
                $ref: '#/components/schemas/DynamicFilterFieldSchema'
              -
                $ref: '#/components/schemas/DynamicFilterSchema'
      type: object
      example: "{\n        \"and\": [\n            {\n                \"field\": \"checkin_date\",\n                \"operator\": \"less_than_or_equal\",\n                \"value\": \"2023-12-01T00:00:00\"\n            },\n            {\n                \"or\": [\n                    {\n                        \"and\": [\n                            {\n                                \"field\": \"checkin_date\",\n                                \"operator\": \"less_than_or_equal\",\n                                \"value\": \"2023-12-01T00:00:00\"\n                            },\n                            {\n                                \"field\": \"guest_first_name\",\n                                \"operator\": \"starts_with\",\n                                \"value\": [\n                                    \"John\",\n                                    \"Doe\"\n                                ]\n                            }\n                        ]\n                    },\n                    {\n                        \"field\": \"guest_last_name\",\n                        \"operator\": \"ends_with\",\n                        \"value\": \"Doe\"\n                    },\n                    {\n                        \"field\": \"guest_name\",\n                        \"operator\": \"in\",\n                        \"value\": [\n                            \"John Smith\",\n                            \"Doe Family\"\n                        ]\n                    },\n                    {\n                        \"field\": \"guest_email\",\n                        \"operator\": \"not_in\",\n                        \"value\": [\n                            \"test@example.com\",\n                            \"fakeuser@example.org\"\n                        ]\n                    },\n                    {\n                        \"field\": \"status\",\n                        \"operator\": \"is_null\"\n                    },\n                    {\n                        \"field\": \"reservation_notes\",\n                        \"operator\": \"is_not_null\"\n                    }\n                ]\n            },\n            {\n                \"field\": \"room_price\",\n                \"operator\": \"equals\",\n                \"value\": 150\n            },\n            {\n                \"field\": \"discount_code\",\n                \"operator\": \"not_equals\",\n                \"value\": \"BLACKFRIDAY2024\"\n            },\n            {\n                \"field\": \"guest_comments\",\n                \"operator\": \"contains\",\n                \"value\": \"great service\"\n            },\n            {\n                \"field\": \"special_requests\",\n                \"operator\": \"not_contains\",\n                \"value\": \"late check-out\"\n            },\n            {\n                \"field\": \"property_name\",\n                \"operator\": \"starts_with\",\n                \"value\": \"Luxury\"\n            },\n            {\n                \"field\": \"property_location\",\n                \"operator\": \"not_starts_with\",\n                \"value\": \"Downtown\"\n            },\n            {\n                \"field\": \"booking_reference\",\n                \"operator\": \"ends_with\",\n                \"value\": \"-2023\"\n            },\n            {\n                \"field\": \"transaction_id\",\n                \"operator\": \"not_ends_with\",\n                \"value\": \"-VOID\"\n            },\n            {\n                \"field\": \"internal_notes\",\n                \"operator\": \"is_empty\"\n            },\n            {\n                \"field\": \"guest_feedback\",\n                \"operator\": \"is_not_empty\"\n            }\n        ]\n    }"
