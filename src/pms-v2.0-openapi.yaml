      description: 'Posts one or more tips (ITC 8995) linked to the check identified by the path {checkId}. The gratuities inherit the check''s folio target and checkNumber; POS context stays an attribute of the linked check (not copied onto the gratuity). The body carries only the gratuity entries. A check may carry many gratuities. Idempotent via the required Idempotency-Key header.'
