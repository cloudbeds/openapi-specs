  /attribute-tagging/v1/tags/query:
    post:
      summary: Returns tags for a list of entities (bulk lookup)
      tags:
        - Tags
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                entities:
                  minItems: 1
                  type: array
                  items:
                    type: object
                    properties:
                      ids:
                        minItems: 1
                        type: array
                        items:
                          type: string
                          pattern: ^\d+$
                      type:
                        type: string
                        enum:
                          - guest_profile
                          - reservation
                    required:
                      - ids
                      - type
                    additionalProperties: false
                  description: "Entities to fetch tags for, grouped by type: a list of `{ ids, type }` groups. Each group binds its id list to a single type, so a group's ids only match tags of that type (no cross-product between ids and types across groups). Use this endpoint instead of `GET /tags?filters=...` for bulk lookups: the body has no URL-length limit. The total number of ids across all groups must not exceed 1000 (enforced in the handler)."
              required:
                - entities
              additionalProperties: false
      parameters:
        - schema:
            type: string
          in: header
          name: x-property-id
          required: true
          description: Property ID(s) - comma-separated list
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      pattern: ^\d+$
                    entityId:
                      type: string
                      pattern: ^\d+$
                    entityType:
                      type: string
                      enum:
                        - guest_profile
                        - reservation
                    propertyId:
                      type: string
                      pattern: ^\d+$
                    attributeId:
