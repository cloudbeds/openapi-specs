            type: string
          in: query
          name: filters
          required: false
          description: >-
            Filter format: `field:operator:value`, multiple filters separated by semicolons.


            Supported fields:

            - `entityTypes:in:` - a comma-separated list of values: `guest_profile`, `reservation`


            Examples:

            - `entityTypes:in:guest_profile,reservation`
        - schema:
            type: string
          in: query
          name: sort
          required: false
          description: |-
            Sort format: `field[:direction]`

            Valid fields: `label`, `createdAt`, `updatedAt`

            Valid directions: `asc`, `desc` (defaults to `asc` when omitted)

            Default: unsorted
        - schema:
            type: string
          in: header
          name: x-organization-id
          required: true
          description: Organization ID
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      pattern: ^\d+$
                    label:
                      type: string
                      minLength: 1
                    description:
                      nullable: true
                      type: string
                    entityTypes:
                      type: array
                      items:
                        type: string
                        enum:
                          - guest_profile
                          - reservation
                    isEnabled:
                      type: boolean
                  required:
                    - id
                    - label
                    - description
                    - entityTypes
                    - isEnabled
                  additionalProperties: false
        "400":
