  /attribute-tagging/v1/tags/bulk:
    post:
      summary: Attach attributes to multiple entities (bulk)
      tags:
        - Tags
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                entities:
                  minItems: 1
                  type: array
                  items:
                    type: object
                    properties:
                      ids:
                        minItems: 1
                        type: array
                        items:
                          type: string
                          pattern: ^\d+$
                      type:
                        type: string
                        enum:
                          - guest_profile
                          - reservation
                      propertyId:
                        type: string
                        pattern: ^\d+$
                        description: Property the tags in this group belong to. Carried per group rather than taken from the `x-property-id` header so one request can span several properties; each group is authorized independently against the caller property ids.
                    required:
                      - ids
                      - type
