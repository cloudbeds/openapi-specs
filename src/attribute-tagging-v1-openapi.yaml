    delete:
      summary: Remove attributes from multiple entities (bulk)
      tags:
        - Tags
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                entities:
                  minItems: 1
                  type: array
                  items:
                    type: object
                    properties:
                      ids:
                        minItems: 1
                        type: array
                        items:
                          type: string
                          pattern: ^\d+$
                      type:
                        type: string
                        enum:
                          - guest_profile
                          - reservation
                      propertyId:
                        type: string
                        pattern: ^\d+$
                        description: Property the tags in this group belong to. Carried per group rather than taken from the `x-property-id` header so one request can span several properties; each group is authorized independently against the caller property ids.
                    required:
                      - ids
                      - type
                      - propertyId
                    additionalProperties: false
                  description: Entities to untag, grouped by type and property, in the same shape the bulk attach takes. The total number of ids across all groups must not exceed 500, and entities x attributeIds must not exceed 5000 (both enforced in the handler).
                attributeIds:
                  minItems: 1
                  type: array
                  items:
                    type: string
                    pattern: ^\d+$
                  description: Attributes removed from every entity in every group. An entity that does not carry a listed attribute is left alone rather than reported as an error, so repeating the request is safe.
              required:
                - entities
                - attributeIds
              additionalProperties: false
      parameters:
        - schema:
            type: string
          in: header
          name: x-property-id
          required: true
